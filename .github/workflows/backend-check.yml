name: PQService backend checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "www/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "www/**"
      - ".github/workflows/backend-check.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Check frontend JavaScript
        run: node --check www/assets/js/app.js
      - name: Run backend API tests
        env:
          PQ_COOKIE_SECURE: "false"
          PQ_SMTP_HOST: ""
        run: pytest -q backend/tests
      - name: Initialize isolated SQLite database
        env:
          PQ_DATABASE_PATH: /tmp/pqservice-ci.sqlite3
          PQ_COOKIE_SECURE: "false"
        run: |
          python -c "from backend.app import init_db; init_db(); print('SQLite schema initialized')"
