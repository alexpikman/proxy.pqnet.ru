name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Check PHP syntax
        run: find public/api scripts api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    needs: php-lint
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PQSERVICE_ADMIN_PASSWORD: ${{ secrets.PQSERVICE_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PQSERVICE_ADMIN_PASSWORD
          script: |
            set -Eeuo pipefail
            cd /var/WWW/proxy.pqnet.ru
            PHP_BIN="$(command -v php)"
            git fetch origin main
            git reset --hard origin/main
            install -d -o www-data -g www-data -m 0700 /var/WWW/data
            runuser -u www-data -- "$PHP_BIN" scripts/bootstrap_data.php
            if [ -n "$PQSERVICE_ADMIN_PASSWORD" ]; then
              runuser -u www-data -- env PQSERVICE_ADMIN_PASSWORD="$PQSERVICE_ADMIN_PASSWORD" "$PHP_BIN" scripts/init_admin.php
            else
              echo "NOTICE: PQSERVICE_ADMIN_PASSWORD secret is empty; admin password not initialized."
            fi
            php -m | grep -qi '^curl$' || { echo "ERROR: PHP cURL extension is required." >&2; exit 1; }
            echo "PHP files deployed and JSON data storage initialized."
